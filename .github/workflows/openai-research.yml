name: OpenAI research strict gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  openai-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: gate
      # Immutable B13 dependency while PR #31 remains unmerged. Updating this
      # pin requires a new execution; old green evidence cannot approve new code.
      - uses: actions/checkout@v4
        with:
          ref: edbd1791b9061c12a2324336e47f082473745e5f
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record both exact revisions
        run: |
          git -C gate rev-parse HEAD
          test "$(git -C source rev-parse HEAD)" = edbd1791b9061c12a2324336e47f082473745e5f
      - name: B13 offline checker
        working-directory: source
        run: python research/OPENAI/check.py --validate --self-test
      - name: B13 resource audit
        if: ${{ !cancelled() }}
        working-directory: source
        run: python research/OPENAI/resource_audit.py --as-of 2026-10-17
      - name: B13 IPO and resource tests
        if: ${{ !cancelled() }}
        working-directory: source
        run: python -m unittest discover -s research/OPENAI -p 'test_*.py' -v
      - name: Independent B01 fail-closed checks
        if: ${{ !cancelled() }}
        env:
          BASKET_OPENAI_SOURCE: ${{ github.workspace }}/source
        run: python -m unittest discover -s gate/tests/integration -p 'openai_research_acceptance.py' -v
