# Optional standard hooks. Install pre-commit separately when adopted by the project.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
